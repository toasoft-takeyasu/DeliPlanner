################################################################################
# システムの制御に関する設定
################################################################################
[System]
# バージョン
Version=0.00
# デバッグ (初期値: OFF)
# 1:ON, 0:OFF
Debug=1
#ログファイルのパス
LogPath=.\DeliPlanner.log
#ログインするか
EnableLogin=1
#品目区分を表示するか
VisivleItemType=0
#品目区分に色を付けるか
PaintItemTypeColor=1

################################################################################
# 消費税に関する設定
################################################################################
[Tax]
# 税計算
# 1:内税、2:外税、3:非課税
Type=2
# 端数処理
#1:切り上げ、2:切り捨て、3:四捨五入
RoundType=2

################################################################################
# データベースに関する設定
################################################################################
[Database]

# 接続文字列
ConnectionString=Provider=Microsoft.Jet.OLEDB.4.0;Data Source=C:\開発資源\サンマート\在庫管理システム\DeliPlanner\DeliPlanner.mdb
ConnectionString2=Server=deliplanner-db.cnau2q6acbuh.ap-northeast-1.rds.amazonaws.com;Port=5432;User Id=postgres;Password=xxx;Database=sunmart;SSL Mode=Require;Trust Server Certificate=True;
